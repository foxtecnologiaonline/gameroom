services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: gameroom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gameroom_dev}
      POSTGRES_DB: gameroom
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameroom"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://gameroom:${POSTGRES_PASSWORD:-gameroom_dev}@postgres:5432/gameroom?schema=public
      # Igual a DATABASE_URL aqui (Postgres local, sem pooler). Em produção com
      # Supabase, DATABASE_URL aponta para o pooler (porta 6543) e DIRECT_URL
      # para a conexão direta (porta 5432) — migrations exigem conexão direta.
      DIRECT_URL: postgresql://gameroom:${POSTGRES_PASSWORD:-gameroom_dev}@postgres:5432/gameroom?schema=public
      # Fila de jobs: QStash (HTTP), não Redis/BullMQ — ver README/DEPLOY.md
      # para rodar `npx @upstash/qstash-cli dev` no host antes de subir o
      # compose. QSTASH_URL aponta para esse servidor local (host, não
      # container — por isso host.docker.internal, ver extra_hosts abaixo).
      QSTASH_URL: ${QSTASH_URL:-http://host.docker.internal:8080}
      QSTASH_TOKEN: ${QSTASH_TOKEN:-}
      QSTASH_CURRENT_SIGNING_KEY: ${QSTASH_CURRENT_SIGNING_KEY:-}
      QSTASH_NEXT_SIGNING_KEY: ${QSTASH_NEXT_SIGNING_KEY:-}
      # URL pela qual o QStash (rodando no host) alcança este backend. Como a
      # porta 3000 já é publicada para o host (ver `ports` abaixo), localhost
      # funciona mesmo o backend rodando dentro do container.
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?defina JWT_ACCESS_SECRET no .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?defina JWT_REFRESH_SECRET no .env}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CODIGO_ENCRYPTION_KEY: ${CODIGO_ENCRYPTION_KEY:?gere com openssl rand -base64 32}
      PAGAMENTO_WEBHOOK_SECRET: ${PAGAMENTO_WEBHOOK_SECRET:?defina PAGAMENTO_WEBHOOK_SECRET no .env}
      RESERVA_EXPIRACAO_MINUTOS: 15
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      PORT: 3000
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    ports:
      - "3001:3001"
    depends_on:
      - backend

volumes:
  postgres_data:
